[package]
name = "duckdb_dq"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Data quality assertion framework for DuckDB — SQL-native expect_* rules, profiling, and persisted quality reports"

[lib]
name = "dq"
crate-type = ["cdylib", "rlib"]

[dependencies]
quack-rs = { version = "0.15", features = ["duckdb-1-5"] }
libduckdb-sys = { version = ">=1.5.4, <2", features = ["loadable-extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
