[package]
name = "duckdb_semantic"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Semantic layer extension for DuckDB — expand modeled SQL against MDL definitions"

[lib]
name = "semantic"
crate-type = ["cdylib", "rlib"]

[dependencies]
quack-rs = { version = "0.15", features = ["duckdb-1-5"] }
libduckdb-sys = { version = ">=1.5.4, <2", features = ["loadable-extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.53"
once_cell = "1"
petgraph = "0.6"
rust-stemmers = "1.2"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
