[package]
name = "duckdb_semantic"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Semantic layer extension for DuckDB — expand modeled SQL against MDL definitions"

[lib]
name = "semantic"
crate-type = ["cdylib", "rlib"]

[features]
# Backend selection for the BM25 full-text index.
# default = handrolled (lightweight pure-Rust inverted index + jieba-rs)
# `tantivy` = tantivy engine (+ tantivy-jieba): phrase queries, better scale
default = ["handrolled"]
handrolled = []
tantivy = ["dep:tantivy", "dep:tantivy-jieba"]

[dependencies]
quack-rs = { version = "0.15", features = ["duckdb-1-5"] }
libduckdb-sys = { version = ">=1.5.4, <2", features = ["loadable-extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.53"
once_cell = "1"
petgraph = "0.6"
rust-stemmers = "1.2"
jieba-rs = "0.7"
tantivy = { version = "0.26.1", optional = true }
tantivy-jieba = { version = "0.20", optional = true }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
