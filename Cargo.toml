[package]
name = "duckdb_semantic"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Semantic layer extension for DuckDB — expand modeled SQL against MDL definitions"

[lib]
name = "semantic"
crate-type = ["cdylib"]

[dependencies]
duckdb = { version = "1.2.0", features = ["extension", "vtab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.53"
